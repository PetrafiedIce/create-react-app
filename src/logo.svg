<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Transparent background -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- subtle outer keyline so it reads on dark tabs -->
    <rect x="1" y="1" width="46" height="46" rx="9"
          fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
    <!-- tilted pencil -->
    <g transform="translate(8,14) rotate(-22,16,10)">
      <path d="M3 17 L6 20 L20 6 L17 3 Z" fill="#F4B400"/>         <!-- body -->
      <path d="M20 6 L23 9 L9 23 L6 20 Z" fill="#DBA106"/>         <!-- shadow -->
      <path d="M1 18 L6 20 L4.5 15.5 Z" fill="#EAA"/>              <!-- eraser -->
      <path d="M4.5 15.5 L9 17 L6 20 Z" fill="#2B2B2B"/>           <!-- ferrule tip -->
      <rect x="11" y="0" width="4" height="24" fill="#2D64F1"/>   <!-- stripe 1 -->
      <rect x="15" y="0" width="4" height="24" fill="#2649B0"/>   <!-- stripe 2 -->
      <!-- pencil outline (thick for tiny sizes) -->
      <path d="M3 17 L6 20 L20 6 L17 3 Z M20 6 L23 9 L9 23 L6 20 Z
               M1 18 L6 20 L4.5 15.5 Z M4.5 15.5 L9 17 L6 20 Z"
            fill="none" stroke="#111" stroke-width="2"/>
      <rect x="11" y="0" width="8" height="24" fill="none" stroke="#111" stroke-width="2"/>
    </g>
    <!-- checkmark -->
    <path d="M28 32 L31 35 L38 26" stroke="#2E7D32" stroke-width="3.2"/>
    <!-- tiny backing stroke for check so it pops on any bg -->
    <path d="M28 32 L31 35 L38 26" stroke="white" stroke-width="1.2" opacity=".8"/>
  </g>
</svg>
